# Render Blueprint: the API, which also serves the site, and its Postgres.
# Render reads this file when the repository is connected (Dashboard → New →
# Blueprint) and again on every push to master. The site is served from here,
# not from Cloudflare: TIM blocks Cloudflare's shared IPs (DEPLOY.md).
#
# Plans. Two things to know:
#   - The API is on the free plan: it sleeps after 15 minutes without
#     requests; waking takes about a minute. The Cloudflare Worker pings it
#     every 10 minutes to keep it awake.
#   - The database is paid since 2026-11 (0.1c-256mb, US$ 6/month plus
#     US$ 0.30 per GB of disk): kept for good, with point-in-time recovery
#     (3 days on the Hobby workspace).
# Keep these values equal to the dashboard: a Blueprint sync applies them.

services:
  - type: web
    name: portal-api
    runtime: node
    plan: free
    # The closest of Render's regions to Brazil. Cannot be changed later.
    region: virginia
    # The whole repository, not only backend/: the site (frontend/) is built
    # here too, and a change in either one redeploys.
    branch: master
    autoDeployTrigger: commit
    # First the site (frontend/dist, plus dist-server/routes.js for the SEO
    # pages), then the API. Dev dependencies too: Vite, TypeScript and the
    # Prisma CLI are needed to build, and NODE_ENV=production would skip them.
    buildCommand: cd frontend && npm ci --include=dev && npm run build && npm run build:server && cd ../backend && npm ci --include=dev && npm run build
    # Applies pending migrations, then starts the compiled API (and the site).
    startCommand: cd backend && npx prisma migrate deploy && node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: portal-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Copy this value into the Cloudflare Worker's PROXY_SECRET secret, so
      # the API knows the visitor behind the workers.dev address.
      - key: PROXY_SECRET
        generateValue: true
      # Google Analytics (G-XXXXXXX), read when the site is built. Empty: no
      # analytics and no cookie banner.
      - key: VITE_GA_ID
        sync: false
      # Asked for when the Blueprint is created.
      - key: CLOUDINARY_URL
        sync: false
      - key: SITE_URL
        sync: false
      - key: CLOUDINARY_FOLDER
        value: portal
      # Password recovery e-mails: MAIL_PROVIDER=brevo now, resend once the
      # portal has its own domain. MAIL_FROM is the sender address verified in
      # that service. Set all three in the dashboard; until then nothing is
      # sent (the API logs a warning on start).
      - key: MAIL_PROVIDER
        sync: false
      - key: MAIL_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # "Entrar com Google": the OAuth client from the Google Cloud Console.
      # Both empty hides the button. Its redirect URI is
      # SITE_URL + /api/auth/google/callback.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Push notifications: the pair from `npx web-push generate-vapid-keys`.
      # Without them the "Ativar notificações" button stays hidden.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false

databases:
  - name: portal-db
    plan: 0.1c-256mb
    region: virginia
    databaseName: portal
    user: portal
    # The same major version as docker-compose.yml.
    postgresMajorVersion: "16"
